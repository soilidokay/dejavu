services:
  db:
    image: postgres:10.7-alpine
    environment:
      - POSTGRES_DB=dejavu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./data/postgress:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - db_network
  python:
    image: nttkimsong/dejavu-query-app:latest
    volumes:
      - ./data/dejavu:/data
      - ./source:/source
    environment:
      - DATA_INDEX=/data/index
      - DATA_RESULT=/data/reusts
      - SOURCE_INDEX=/source
    ports:
      - 8000:7860
    depends_on:
      - db
    networks:
      - db_network
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - db_network
networks:
  db_network: